[build]
  command = "bun install --frozen-lockfile && bun run build"
  publish = "dist"
[build.environment]
  BUN_VERSION = "1.3.6"
  NODE_VERSION = "22"
[context.deploy-preview]
  command = "bun install --frozen-lockfile && bun run build"
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
