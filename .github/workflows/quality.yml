name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint && bun run check-format && bun run typecheck
      - name: Check foundation design patterns
        run: |
          mkdir -p reports
          curl --fail --silent --show-error --location https://github.com/pbakaus/impeccable/releases/download/engine-v0.1.11/impeccable-linux-x64 --output "$RUNNER_TEMP/impeccable"
          printf '0221607e1f535af937ea267c347b1f90233b85dc2563cbd2eeefdf42e0e5c594  %s\n' "$RUNNER_TEMP/impeccable" | sha256sum --check
          chmod +x "$RUNNER_TEMP/impeccable"
          "$RUNNER_TEMP/impeccable" detect --json index.html src/index.scss src/styles src/containers/Main.tsx src/containers/Main.scss src/components/header src/components/footer src/components/requestTrace src/containers/greeting src/containers/skills > reports/design.json
      - run: bun run build && bun run check:bundle && bun run test:static
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            reports/
            .lighthouseci/
          retention-days: 14
